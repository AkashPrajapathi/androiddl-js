<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroidDL MatMul Backward Test</title>
</head>

<body>
    <script type="module">
        import { Tensor, Linear } from "./androiddl.js";

        const layer = new Linear(2, 3);

        const input = new Tensor([
            [1, 2],
            [3, 4]
        ], [2, 2]);

        const output = layer.forward(input);

        // Reduce output to a scalar loss.
        const loss = output.sum([0, 1]);

        console.log("Loss shape:", loss.shape); // []

        // Backpropagation
        loss.backward();

        console.log("Weight grad shape:", layer.w.grad.shape);
        console.log("Weight grad:", layer.w.grad.toString());

        console.log("Bias grad shape:", layer.b.grad.shape);
        console.log("Bias grad:", layer.b.grad.toString());

    </script>
</body>

</html>
