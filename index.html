<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroidDL.js</title>
</head>

<body>
    <script type="module">
        import { Tensor, Linear } from "./androiddl.js";

        const layer = new Linear(2, 3);
        
        const input = new Tensor([
            [1, 2],
            [3, 4]
        ], [2, 2]);

        const output = layer.forward(input);

        // Reduce output to a scalar loss.
        const loss = output.sum([0, 1]);

        // Backpropagation
        loss.backward();

        console.log(layer);

        console.log("Loss: ", loss.toString()); // []
        console.log("Loss grad : ", loss.grad); // []

        console.log("Weight: ", layer.w.toString());
        console.log("Weight grad :", layer.w.grad.toString());

        console.log("Bias: ", layer.b.toString());
        console.log("Bias grad: ", layer.b.grad.toString());

    </script>
</body>

</html>
