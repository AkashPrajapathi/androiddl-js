<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script type="module">

        import { Tensor } from "./androiddl.js"

        // 1. Matrix × Matrix
        const a = new Tensor(
            [1, 2, 3, 4, 5, 6],
            [2, 3]
        );

        const b = new Tensor(
            [7, 8, 9, 10, 11, 12],
            [3, 2]
        );

        console.log("Matrix × Matrix:");
        console.log(a.matmul(b).toString());


        // 2. Matrix × Vector
        const c = new Tensor(
            [1, 2, 3, 4, 5, 6],
            [2, 3]
        );

        const d = new Tensor(
            [7, 8, 9],
            [3]
        );

        console.log("Matrix × Vector:");
        console.log(c.matmul(d).toString());


        // 3. Vector × Matrix
        const e = new Tensor(
            [1, 2, 3],
            [3]
        );

        const f = new Tensor(
            [4, 5, 6, 7, 8, 9],
            [3, 2]
        );

        console.log("Vector × Matrix:");
        console.log(e.matmul(f).toString());


        // 4. Vector × Vector
        const g = new Tensor(
            [1, 2, 3],
            [3]
        );

        const h = new Tensor(
            [4, 5, 6],
            [3]
        );

        console.log("Vector × Vector:");
        console.log(g.matmul(h).toString());


    </script>
</body>

</html>
