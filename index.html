<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroidDL.js</title>
</head>

<body>
    <script type="module">
        import { Tensor, Linear, Module } from "./androiddl.js";

        class Net extends Module {
            constructor(inFeaturse, outFeatures) {
                super()
                this.fc1 = new Linear(inFeaturse, outFeatures)
                this.fc2 = new Linear(outFeatures, outFeatures)
                this.fc3 = new Linear(outFeatures, 16)
            }

            forward(x) {
                x = this.fc1.call(x)
                x = this.fc2.call(x)
                x = this.fc3.call(x)

                return x
            }
        }

        const net1 = new Net(2, 3)
        const net2 = new Net(2, 3)

        // Save net1's parameters
        const state = net1.stateDict()

        // Load them into net2
        net2.loadStateDict(state)

        // Verify that parameters match
        for (const [name, param] of net1.namedParameters()) {
            const other = new Map(net2.namedParameters()).get(name)

            console.log(
                name,
                param.data.every((value, i) => value === other.data[i])
            )
        }


    </script>
</body>

</html>
