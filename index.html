<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AndroidDL MatMul Backward Test</title>
</head>

<body>
    <script type="module">
        import { Tensor } from "./androiddl.js";

        // A shape: [2, 1, 2, 2]
        const a = new Tensor(
            [
                3, 1, 1, 2,
                4, 2, 5, 2
            ],
            [2, 4]
        );

        // B shape: [3, 2, 2]
        const b = new Tensor(
            [
                1, 4, 4, 2,
                3, 5, 1, 5
            ],
            [2, 4]
        );

        a.requiresGrad = true;
        b.requiresGrad = true;

        // Forward pass
        const c = a.mean([1]);
        const d = b.sum([1]);

        const gradC = new Tensor(
            [10, 20],
            [2]
        );

        const gradD = new Tensor(
            [10, 20],
            [2]
        );

        // Backward pass
        c.backward(gradC);
        d.backward(gradD);


        console.log("C:", c.toString());
        console.log("gradC:", c.grad.toString());

        console.log("A:", a.toString());
        console.log("gradA:", a.grad.toString());

        console.log("D:", d.toString());
        console.log("gradD:", d.grad.toString());

        console.log("B:", b.toString());
        console.log("gradB:", b.grad.toString());

    </script>
</body>

</html>
